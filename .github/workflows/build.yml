name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projektordner finden
        id: p
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "Keine settings.gradle gefunden. Dateien wurden nicht richtig hochgeladen."
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Mod bauen
        run: gradle build
        working-directory: ${{ steps.p.outputs.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: voicechair-mod
          path: |
            ${{ steps.p.outputs.dir }}/build/libs/*.jar
            !${{ steps.p.outputs.dir }}/build/libs/*-sources.jar
